version: '3.8'

services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: growthlab-libretranslate
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - LT_UPDATE_MODELS=true
      - LT_LOAD_ONLY=en,zh,es,fr,de,ja,ko,ar,hi,pt
      - LT_DEBUG=true
      - LT_REQ_LIMIT=1000
      - LT_CHAR_LIMIT=5000
    volumes:
      - libretranslate_models:/home/libretranslate/.local
      - libretranslate_data:/app/db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/languages"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  libretranslate_models:
    driver: local
  libretranslate_data:
    driver: local
